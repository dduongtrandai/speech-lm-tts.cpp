name: Release SpeechLM TTS CPU Runtime

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build and Package CPU Release
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild and Visual Studio Developer Command Prompt
        uses: microsoft/setup-msbuild@v2

      - name: Install ONNX Runtime SDK (v1.17.1)
        shell: pwsh
        run: |
          $Url = "https://github.com/microsoft/onnxruntime/releases/download/v1.17.1/onnxruntime-win-x64-1.17.1.zip"
          $ZipFile = "onnxruntime-win-x64-1.17.1.zip"
          Write-Host "Downloading ONNX Runtime SDK from $Url..."
          Invoke-WebRequest -Uri $Url -OutFile $ZipFile
          Write-Host "Extracting ONNX Runtime SDK..."
          Expand-Archive -Path $ZipFile -DestinationPath "ort_sdk"
          $OrtRoot = Resolve-Path "ort_sdk/onnxruntime-win-x64-1.17.1"
          echo "ONNXRUNTIME_ROOT=$OrtRoot" >> $env:GITHUB_ENV
          Write-Host "ONNX Runtime SDK successfully installed at $OrtRoot"

      - name: Configure CMake
        shell: pwsh
        run: |
          if (Test-Path "build/CMakeCache.txt") {
            Remove-Item -Recurse -Force "build"
          }
          $llamaDir = ""
          if (Test-Path "llama.cpp/CMakeLists.txt") {
            $llamaDir = "llama.cpp"
          } elseif (Test-Path "llama/CMakeLists.txt") {
            $llamaDir = "llama"
          } else {
            Write-Error "Could not find llama.cpp source directory (expected llama.cpp/ or llama/)."
          }

          $cmakeArgs = @(
            "-B", "build",
            "-S", ".",
            "-DCMAKE_BUILD_TYPE=Release",
            "-DSLM_LLAMA_DIR=$llamaDir",
            "-DONNXRUNTIME_ROOT=${{ env.ONNXRUNTIME_ROOT }}"
          )

          cmake @cmakeArgs

      - name: Build Project
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Package Runtime Release
        shell: pwsh
        run: |
          pwsh -File scripts/package-runtime.ps1 `
            -BuildDir "build" `
            -OutputDir "dist" `
            -OnnxRuntimeRoot "${{ env.ONNXRUNTIME_ROOT }}"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/speech-lm-tts-win-cpu.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
